name: LMS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lms

jobs:
  # -------------------------------------------------------------------
  # Job 1: Lint, Test & Build Validation
  # -------------------------------------------------------------------
  build-and-test:
    name: Test & Validate Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            laundry_system-main/package-lock.json
            server/package-lock.json

      - name: Test & Build Frontend
        working-directory: ./laundry_system-main
        run: |
          npm ci
          npm run build

      - name: Test & Validate Backend
        working-directory: ./server
        run: |
          npm ci

  # -------------------------------------------------------------------
  # Job 2: Build & Push Docker Images to GitHub Container Registry (GHCR)
  # -------------------------------------------------------------------
  build-and-push-images:
    name: Build & Push Docker Containers
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Prefix
        run: |
          echo "IMAGE_PREFIX_LOWER=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}-backend:${{ github.sha }}

      # Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./laundry_system-main
          file: ./laundry_system-main/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX_LOWER }}-frontend:${{ github.sha }}

  # -------------------------------------------------------------------
  # Job 3: Kubernetes Manifests Dry-run & Linting
  # -------------------------------------------------------------------
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Test Kubernetes Kustomization Build
        run: |
          kubectl kustomize ./k8s
